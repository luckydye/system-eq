[package]
name = "room-tune"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Room correction and system-wide EQ for Windows"
license = "MIT"

[dependencies]
anyhow = "1.0"
cpal = "=0.17.3"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = { version = "0.15", default-features = false }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
uuid = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package.rustfft]
opt-level = 3

[lints.clippy]
undocumented_unsafe_blocks = "warn"
